name: Update Solved Problems Count

on:
  schedule:
    # Runs automatically every day at 00:00 UTC (6:00 AM BST)
    - cron: '0 0 * * *'
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-readme:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Count problems and update README
        run: |
          # 1. Detect README file (README.MD or README.md)
          if [ -f "README.MD" ]; then
            README_FILE="README.MD"
          elif [ -f "README.md" ]; then
            README_FILE="README.md"
          else
            echo "Error: README file not found!"
            exit 1
          fi
          echo "Target README file: $README_FILE"

          # 2. Count files in problems/ directory with supported extensions (.cpp, .c, .py, .java, .js, .ts)
          if [ -d "problems" ]; then
            COUNT=$(find problems -type f \( -iname "*.cpp" -o -iname "*.c" -o -iname "*.py" -o -iname "*.java" -o -iname "*.js" -o -iname "*.ts" \) | wc -l | tr -d ' ')
          else
            # If 'problems/' directory does not exist yet, count from root excluding .git and .github
            COUNT=$(find . -type d \( -name ".git" -o -name ".github" \) -prune -o -type f \( -iname "*.cpp" -o -iname "*.c" -o -iname "*.py" -o -iname "*.java" -o -iname "*.js" -o -iname "*.ts" \) -print | wc -l | tr -d ' ')
          fi
          echo "Total problems solved: $COUNT"

          # 3. Update the marker section in README using Python
          python3 - <<EOF
          import re

          readme_file = "$README_FILE"
          count = "$COUNT"

          with open(readme_file, "r", encoding="utf-8") as f:
              content = f.read()

          pattern = r"<!--\s*PROBLEM_COUNT_START\s*-->[\s\S]*?<!--\s*PROBLEM_COUNT_END\s*-->"
          replacement = f"<!-- PROBLEM_COUNT_START -->\n- Total {count} problems solved.\n<!-- PROBLEM_COUNT_END -->"

          if not re.search(pattern, content):
              print(f"Error: Markers <!-- PROBLEM_COUNT_START --> and <!-- PROBLEM_COUNT_END --> not found in {readme_file}")
              exit(1)

          updated_content = re.sub(pattern, replacement, content)

          with open(readme_file, "w", encoding="utf-8") as f:
              f.write(updated_content)

          print(f"Successfully updated {readme_file} with count: {count}")
          EOF

          # 4. Commit and push only if README has changed
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"

          if ! git diff --quiet "$README_FILE"; then
            echo "Changes detected in $README_FILE. Committing and pushing..."
            git add "$README_FILE"
            git commit -m "Update solved problems count to $COUNT"
            git push
          else
            echo "No changes in problem count. Skipping commit."
          fi
